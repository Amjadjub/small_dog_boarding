services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dog_boarding
      POSTGRES_USER: dog_boarding
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dog_boarding -d dog_boarding"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
